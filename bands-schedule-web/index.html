<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Band Schedule - Join the Rhythm</title>
  <style>
    body {
      background-color: #0F172A;
      color: #F8FAFC;
      font-family: -apple-system, system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }

    .card {
      background-color: #1E293B;
      padding: 40px;
      border-radius: 24px;
      max-width: 400px;
      width: 85%;
      border: 1px solid #334155;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transition: opacity 0.5s;
    }

    .icon {
      font-size: 56px;
      margin-bottom: 24px;
    }

    h1 {
      color: #818CF8;
      margin: 0 0 12px;
      font-size: 28px;
      font-weight: 800;
    }

    p {
      color: #94A3B8;
      margin: 0 0 32px;
      font-size: 16px;
      line-height: 1.5;
    }

    input {
      background-color: #334155;
      border: 1px solid #475569;
      color: white;
      padding: 14px 20px;
      border-radius: 12px;
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 16px;
      font-size: 16px;
    }

    .btn {
      background-color: #818CF8;
      color: #0F172A;
      padding: 18px 32px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
      display: block;
      font-size: 16px;
      transition: 0.2s ease;
      cursor: pointer;
      border: none;
      width: 100%;
      margin-bottom: 12px;
    }

    .btn:hover {
      background-color: #6366F1;
      transform: translateY(-2px);
    }

    .btn-secondary {
      background-color: transparent;
      color: #818CF8;
      border: 2px solid #818CF8;
    }

    .btn-secondary:hover {
      background-color: rgba(129, 140, 248, 0.1);
    }

    .footer {
      margin-top: 24px;
      font-size: 12px;
      color: #475569;
    }

    .error {
      color: #F87171;
    }

    #loading-spinner {
      border: 4px solid rgba(255, 255, 255, 0.1);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border-left-color: #818CF8;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <div class="card" id="card">
    <div id="loading-area">
      <div id="loading-spinner"></div>
      <p id="loading-text">Syncing your rhythm...</p>
    </div>

    <div id="main-content" style="display: none;">
      <div class="icon" id="main-icon">🎸</div>
      <h1 id="title">Band Schedule</h1>
      <p id="message"></p>
      
      <div id="name-input-area" style="display: none;">
        <input type="text" id="custom-name-field" placeholder="Enter your full name">
        <button class="btn" onclick="retryJoin()">Complete Registration</button>
      </div>

      <a id="action-btn" href="#" class="btn" style="display: none;">Open in App</a>
      <button id="login-btn" class="btn btn-secondary" style="display: none;" onclick="loginWithGoogle()">Login to Continue</button>
      
      <div class="footer" id="footer">Coordinate your band's schedule effortlessly.</div>
    </div>
  </div>

  <script>
    const API_URL = 'https://api.rapoportech.com.br';

    let inviteToken;
    let inviteExpiry;
    let inviteSignature;
    let verifiedBandName;
    // Session returned by bands-api in the #fragment after Google login.
    // Kept only in memory for this page load and revoked after joining.
    let session = null;

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      })[c]);
    }

    async function callFunction(name, body, accessToken) {
      const headers = { 'Content-Type': 'application/json' };
      if (accessToken) headers['Authorization'] = `Bearer ${accessToken}`;
      const res = await fetch(`${API_URL}/api/functions/${name}`, {
        method: 'POST',
        headers,
        body: JSON.stringify(body),
      });
      let data = {};
      try {
        data = await res.json();
      } catch (e) {
        data = {};
      }
      return { ok: res.ok, status: res.status, data };
    }

    // Reads the session (or login error) from the #fragment and removes it
    // from the address bar, so the tokens don't stay in the history.
    function readLoginResult() {
      const fragment = new URLSearchParams(window.location.hash.slice(1));
      if (window.location.hash) {
        history.replaceState(null, '', window.location.pathname + window.location.search);
      }
      if (fragment.get('access_token')) {
        session = {
          accessToken: fragment.get('access_token'),
          refreshToken: fragment.get('refresh_token'),
        };
        return null;
      }
      return fragment.get('error_description') || fragment.get('error');
    }

    async function init() {
      const params = new URLSearchParams(window.location.search);
      inviteToken = params.get('invite');
      inviteExpiry = params.get('exp');
      inviteSignature = params.get('sig');
      const card = document.getElementById('card');

      requestAnimationFrame(() => card.style.opacity = '1');

      const loginError = readLoginResult();

      if (!inviteToken || !inviteExpiry || !inviteSignature) {
        showUI("Band Schedule", "Connect with your band members and manage your schedule effortlessly.<br><br>Use an invite link to join a band!");
        return;
      }

      try {
        const verifyResult = await callFunction('join-from-link', {
          invite: inviteToken, exp: inviteExpiry, sig: inviteSignature,
        });

        if (!verifyResult.data?.valid) {
          showUI("Invite Not Found", escapeHtml(verifyResult.data?.error || "This invitation link is invalid or has expired."), true);
          return;
        }

        verifiedBandName = verifyResult.data.bandName;

        if (session) {
          joinProcess();
        } else {
          let text = `You've been invited to join <b>${escapeHtml(verifiedBandName)}</b>.<br><br>Login with Google to join instantly.`;
          if (loginError) text += `<br><br><span class="error">Login failed: ${escapeHtml(loginError)}</span>`;
          showUI(`Join ${verifiedBandName}`, text);
          document.getElementById('login-btn').style.display = 'block';
        }
      } catch (e) {
        console.error('Verification error:', e);
        showUI("Connection Problem", "Could not check this invitation. Please try again in a moment.", true);
      }
    }

    async function joinProcess(customName = null) {
      document.getElementById('loading-area').style.display = 'block';
      document.getElementById('main-content').style.display = 'none';
      document.getElementById('name-input-area').style.display = 'none';
      document.getElementById('login-btn').style.display = 'none';

      try {
        const { ok, status, data } = await callFunction(
          'join-band',
          { inviteToken: inviteToken, customName: customName },
          session.accessToken,
        );

        if (!ok) {
          if (data.error === 'NAME_REQUIRED') {
            showUI("Almost Done!", "Please confirm your name to complete the process:");
            document.getElementById('name-input-area').style.display = 'block';
            return;
          }
          if (status === 401) {
            session = null;
            showUI(`Join ${verifiedBandName}`, "Your login has expired. Please login again to join.", true);
            document.getElementById('login-btn').style.display = 'block';
            return;
          }
          throw new Error(data.error || "Failed to join.");
        }

        showUI("🤘 Joined Successfully!", `Welcome, <b>${escapeHtml(data.user_name)}</b>!<br><br>You've successfully joined <b>${escapeHtml(data.band_name)}</b>.<br><br>Open the Band Schedule app to see your band.`);
        logout();
      } catch (e) {
        console.error(e);
        showUI("Syncing Issue", escapeHtml(e.message || "Failed to process invitation."), true);
        logout();
      }
    }

    // The page only needs the session to join; revoke it right after.
    function logout() {
      if (!session?.refreshToken) return;
      const refreshToken = session.refreshToken;
      session = null;
      fetch(`${API_URL}/api/auth/logout`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ refreshToken }),
        keepalive: true,
      }).catch(() => {});
    }

    function retryJoin() {
      const name = document.getElementById('custom-name-field').value.trim();
      if (!name) return alert("Please enter a name.");
      joinProcess(name);
    }

    function loginWithGoogle() {
      // Comes back to this same URL (with the invite query) carrying the session in the #fragment.
      const redirectTo = window.location.origin + window.location.pathname + window.location.search;
      window.location.href = `${API_URL}/api/auth/google/authorize?redirect_to=${encodeURIComponent(redirectTo)}`;
    }

    function showUI(head, text, isError = false) {
      document.getElementById('loading-area').style.display = 'none';
      document.getElementById('main-content').style.display = 'block';
      document.getElementById('title').innerText = head;
      document.getElementById('title').classList.toggle('error', isError);
      document.getElementById('message').innerHTML = text;
    }

    init();
  </script>
</body>
</html>
